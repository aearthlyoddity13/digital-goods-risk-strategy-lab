services:
  - type: web
    name: digital-goods-risk-strategy-lab-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: digital-goods-risk-strategy-lab-api
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://www.charlene-yang.com,https://charlene-yang.com
      - key: CORS_ORIGIN_REGEX
        value: ^$
