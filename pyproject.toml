[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merchant-credit-reserve-engine"
version = "0.1.0"
description = "Explainable digital-product merchant credit and reserve decision engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charlene Yang" }]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "PyYAML==6.0.2",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.2",
  "mypy==1.13.0",
  "types-PyYAML==6.0.12.20240917",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["merchant_risk*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["merchant_risk", "api"]
mypy_path = "src:."
