policy_version: policy-0.1.0
# Score thresholds (0–100 risk score)
approve_max_score: 35
controls_max_score: 55
review_max_score: 75
# Above review_max_score → decline on score alone (unless already declined by hard rule)
# Hard policy rules
hard_decline_chargeback_rate: 0.05
hard_decline_fraud_alert_rate: 0.08
hard_review_unverified: true
# Reserve policy
reserve:
  coverage_multiplier: 1.25  # reserve targets coverage_multiplier * EL / projected TPV
  floor_rate: 0.02
  cap_rate: 0.25
  approve_with_controls_min_rate: 0.05
  zero_reserve_below_el: 50.0  # currency; skip reserve if EL very small and low score
# Manual review triggers
manual_review:
  partial_verification: true
  growth_spike: 2.0  # tpv_growth_3m above this with score in controls/review band
  el_over_tpv: 0.08
