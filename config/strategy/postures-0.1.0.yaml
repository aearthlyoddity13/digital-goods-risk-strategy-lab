posture_version: postures-0.2.0
disclaimer: >
  All policy effects are synthetic demonstration assumptions. They are not
  calibrated estimates of any payment platform's control performance.

risk_appetite:
  maximum_residual_risk_score: 55
  balanced_growth_near_equivalence_share: 0.005

commercial_assumptions:
  # Synthetic probability that an uncovered customer-obligation gap becomes
  # an economic loss during the modeled monthly horizon.
  contingent_exposure_realization_rate: 0.10

postures:
  permissive:
    label: Permissive
    approval_rate_delta: 0.010
    fraud_loss_multiplier: 1.15
    dispute_rate_multiplier: 1.10
    refund_rate_multiplier: 0.95
    monitoring_and_review_cost: 200
    false_positive_volume_share: 0.002
    reserve_rate_delta: -0.03
    holding_days_delta: -14
    residual_risk_multiplier: 1.15
    description: Minimal friction and faster approved volume with greater residual exposure.

  balanced_growth:
    label: Balanced growth
    approval_rate_delta: 0.000
    fraud_loss_multiplier: 0.80
    dispute_rate_multiplier: 0.85
    refund_rate_multiplier: 1.05
    monitoring_and_review_cost: 500
    false_positive_volume_share: 0.008
    reserve_rate_delta: 0.00
    holding_days_delta: 0
    residual_risk_multiplier: 0.82
    description: Mechanism-specific controls with release conditions and moderate friction.

  conservative:
    label: Conservative
    approval_rate_delta: -0.030
    fraud_loss_multiplier: 0.60
    dispute_rate_multiplier: 0.70
    refund_rate_multiplier: 0.90
    monitoring_and_review_cost: 900
    false_positive_volume_share: 0.030
    reserve_rate_delta: 0.05
    holding_days_delta: 30
    residual_risk_multiplier: 0.62
    description: Lower residual exposure with higher false-positive and liquidity costs.
